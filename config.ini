# EOSIO configuration file

# Chain database size in MB (should be less than  available RAM)
chain-state-db-size-mb =  44576

# HTTP server settings
http-server-address = 0.0.0.0:8888

# CORS settings
access-control-allow-origin = *
access-control-allow-headers = Origin, X-Requested-With, Content-Type, Accept

# Plugin settings
plugin = eosio::chain_api_plugin
plugin = eosio::http_plugin
plugin = eosio::chain_plugin
# plugin = eosio::producer_plugin
#plugin = eosio::producer_api_plugin
#plugin = eosio::prometheus_plugin
plugin = eosio::db_size_api_plugin

#prometheus-exporter-address=0.0.0.0:9101

# Miscellaneous settings
abi-serializer-max-time-ms = 2000
chain-threads = 8
contracts-console = true
eos-vm-oc-compile-threads = 4
verbose-http-errors = true
http-validate-host = false
http-threads = 6

# Pull API node specific settings
api-accept-transactions = true

# alohaeosprod: GB, London
p2p-peer-address = peer.main.alohaeos.com:9876
# atticlabeosb: UA, Kyiv
p2p-peer-address = eosbp-0.atticlab.net:9876
# bp4dex223dao: US, United States
p2p-peer-address = p2p.dex223.io:9876
# cryptolions1: DE, Germany-Finland
p2p-peer-address = p2p.eos.cryptolions.io:9876
# eos42freedom: DE, Frankfurt
p2p-peer-address = p2p.eos42.io:9876
# eosamsterdam: DE, eos01
p2p-peer-address = mainnet.eosamsterdam.net:9876
# eoseouldotio: KR, Seoul
p2p-peer-address = p2p2.eoseoul.io:30333
# eosnationftw: CA, Canada
p2p-peer-address = eos.seed.eosnation.io:9876
# eosphereiobp: CA, Beauharnois
p2p-peer-address = peer1.eosphere.io:9876
# eossupportbp: US, United States
p2p-peer-address = p2p.eossupport.io:9876
# ivote4eosusa: US, Greenville,SC,USA
p2p-peer-address = eos.p2p.eosusa.io:9882


enable-account-queries = true
p2p-listen-endpoint = 0.0.0.0:9876
p2p-max-nodes-per-host = 100
sync-fetch-span = 2000

wasm-runtime = eos-vm-jit
read-mode = read-only #head
validation-mode = light #full
max-transaction-time = 150000

agent-name="eos.theaibunny.com"
max-clients=100
connection-cleanup-period=30
